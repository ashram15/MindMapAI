services:
  # 1. C++ Engine
  cpp_engine:
    build: ./cpp-engine
    ports:
      - "8080:8080"
    networks:
      - mindmap-net

  # 2. Python Brain
  python_api:
    build: ./python-api
    ports:
      - "8000:8000"
    env_file:
      - ./python-api/.env
    environment:
      - CPP_SERVER_URL=http://cpp_engine:8080/search
    depends_on:
      - cpp_engine
    networks:
      - mindmap-net

  # 3. Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/search
    depends_on:
      - python_api
    networks:
      - mindmap-net

networks:
  mindmap-net:
    driver: bridge
